cat > .github/workflows/deploy.yml << 'EOF'
name: Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  BACKEND_ECR: 304106859365.dkr.ecr.ap-south-1.amazonaws.com/8byte-app
  FRONTEND_ECR: 304106859365.dkr.ecr.ap-south-1.amazonaws.com/8byte-frontend
  EKS_CLUSTER: 8byte-eks

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        working-directory: app/backend
        run: |
          docker build --platform linux/amd64 -t ${{ env.BACKEND_ECR }}:latest .
          docker push ${{ env.BACKEND_ECR }}:latest

      - name: Build and push frontend
        working-directory: app/frontend
        run: |
          docker build --platform linux/amd64 -t ${{ env.FRONTEND_ECR }}:latest .
          docker push ${{ env.FRONTEND_ECR }}:latest

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Deploy to cluster
        run: kubectl apply -f k8s/

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/backend --timeout=120s
          kubectl rollout status deployment/frontend --timeout=120s
EOF